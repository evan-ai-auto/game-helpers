[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-helpers"
version = "0.1.0"
description = "Windows game GUI automation core for authorized automation and testing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "evan-ai-auto"}]
dependencies = ["Pillow>=10.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
windows = ["pywin32>=306", "windows-capture>=1.5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
